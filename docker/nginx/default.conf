upstream php_backend {
    zone php_backend 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server php-fpm:9000 resolve;
}

server {
    listen 80;
    server_name _;
    root /app/frontend;
    index index.html;
    location = / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/backend/public/site.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass php_backend;
    }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/backend/public/site.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass php_backend;
    }
    location = /admin/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/backend/public/admin/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass php_backend;
    }
    location ~ ^/(contato|catalogo)\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/backend/public/$1.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass php_backend;
    }
    location = /admin/tracks.php {
        # Envio de faixas: o limite do PHP (20 MB) é conferido de novo no código.
        client_max_body_size 21m;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/backend/public/admin/tracks.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass php_backend;
    }
    location ~ ^/admin/(index|login|logout|users|messages)\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/backend/public/admin/$1.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass php_backend;
    }
    client_max_body_size 4m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self'; script-src 'self'; style-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    location /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/backend/public/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass php_backend;
    }
    location /_audio/ {
        internal;
        alias /app/storage/audio/;
        max_ranges 1;
    }
    location /covers/ {
        # Os nomes trazem um hash do conteúdo: uma capa nova sempre ganha outro nome.
        expires 30d;
        alias /app/storage/covers/;
    }
    # Revalida JS/CSS a cada carga (ETag → 304); sem isso o navegador
    # reaproveita módulos antigos por cache heurístico após uma atualização.
    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
    location ~ /\. { deny all; }
}
